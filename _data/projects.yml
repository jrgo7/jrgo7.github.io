      url: https://github.com/jrgo7/empathic-ide
    - title: "Analysis on GitHub"
      url: https://github.com/jrgo7/eda-empathic-ide

- title: "An Analysis on Competitive Pokémon Teams"
  description:
    - "A complete data science project on Pokémon Showdown. It covers data wrangling, exploratory analysis, data mining, and statistical inference, aimed at finding patterns in team building, metagame trends, and strategy in Gen 5 OU match data."
    - "Teams tend to be built around controlling the weather, at every skill level measured by ELO. The metagame still changes over time, even in an older generation of games. Made for CSMODEL, a data science course at DLSU."
  image:
    src: assets/img/pokemon.webp
    width: 1400
    height: 990
    alt: "A poster showing the results of the Pokémon team analysis."
  repo: https://github.com/jrgo7/csmodel-mco

