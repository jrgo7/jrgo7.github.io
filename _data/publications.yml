- year: 2026
  title: "Apparent Age Estimation: Challenges and Outcomes"
  url: https://arxiv.org/abs/2604.03335v1
  venue: "Philippine Computing Science Congress 2026"
  description:
    - "A data science project on apparent age estimation. We looked at the IMDB-WIKI dataset, the largest dataset for apparent age estimation, and the Deep EXpectation (DEX) method, which fine-tunes a VGG-16 model for the task."
    - "After replicating the original model, we tried to improve it by fine-tuning on combinations of other apparent age datasets, including ChaLearn LAP, APPA-REAL, and FairFace. We also replaced the cross-entropy loss with mean-variance loss and adaptive mean-residue loss."
